{{ define "main" -}}
  <h1>{{ .Title }}</h1>


{{ .Content }}
<div class="posts">
{{ range .Data.Pages -}}
<article class="post">
  <h3 class="post-title">
    <a href="{{ .Permalink }}">{{ .Title }}</a>
  </h3>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z0700" }}" class="post-date">{{ .Date.Format "Monday 2 January, 2006" }}</time>
  {{ .Summary }}
</article>
{{- end }}
</div>
{{- end }}
